<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Premium Todo App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-background"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">✓</span>
                <h1>TaskFlow</h1>
            </div>
            <p class="subtitle">Vanilla JS • State-Derived UI</p>
        </header>

        <!-- Input Area -->
        <div class="input-card">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
            <button onclick="addTodo()" class="btn-primary">
                <span>Add Task</span>
                <span class="btn-icon">+</span>
            </button>
        </div>

        <!-- Filter Controls -->
        <div class="filter-bar">
            <div class="filters">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn active">All</button>
                <button onclick="setFilter('active')" id="filter-active" class="filter-btn">Active</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn">Completed</button>
            </div>
            <div class="stats">
                <span id="items-left">0 items left</span>
            </div>
        </div>

        <!-- Todos Container -->
        <main class="todo-card">
            <div id="todos" class="todo-list">
                <!-- Dynamically populated by script.js -->
            </div>
        </main>
    </div>

    <!-- Custom Premium Edit Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit Task</h2>
                <button onclick="closeEditModal()" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="edit-input" placeholder="Task description">
            </div>
            <div class="modal-footer">
                <button onclick="closeEditModal()" class="btn-secondary">Cancel</button>
                <button onclick="saveEdit()" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
